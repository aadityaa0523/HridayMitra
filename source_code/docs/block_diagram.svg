<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="990" viewBox="0 0 1320 990" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#33454a"/></marker></defs><rect width="1320" height="990" fill="#fbfcfc"/><text x="20" y="34" font-size="22" font-weight="700" fill="#1b2427" >HridayMitra home unit: block diagram</text><text x="20" y="56" font-size="13" font-weight="400" fill="#5b6a6f" >Check-in stool + Kavach amulet + SMS care loop. Solid arrows = signal or data flow; dashed yellow boxes = what happens when something fails.</text><text x="20" y="84" font-size="14" font-weight="700" fill="#0d6b6e" letter-spacing="1">SENSORS ON THE STOOL</text><text x="470" y="84" font-size="14" font-weight="700" fill="#0d6b6e" letter-spacing="1">ESP32 WROOM-32 (STATION BRAIN)</text><text x="900" y="84" font-size="14" font-weight="700" fill="#0d6b6e" letter-spacing="1">OUTPUTS AND POWER</text><rect x="20" y="96" width="400" height="56" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4"/><text x="220.0" y="120.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">4 load cells, wired as one full bridge</text><text x="220.0" y="137.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">HX711: data GPIO32, clock GPIO14</text><rect x="20" y="168" width="270" height="50" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4"/><text x="155.0" y="189.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">8 electrodes</text><text x="155.0" y="206.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">4 foot plates + 4 hand strips</text><rect x="20" y="234" width="270" height="62" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4"/><text x="155.0" y="252.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">2 x 74HC4052 path mux</text><text x="155.0" y="269.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">legs, arms, right side, left side</text><text x="155.0" y="286.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">S0 GPIO33, S1 GPIO27</text><rect x="20" y="312" width="270" height="50" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4"/><text x="155.0" y="333.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">74HC4053 body / R5 selector</text><text x="155.0" y="350.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">select on GPIO18</text><rect x="20" y="378" width="270" height="50" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4"/><text x="155.0" y="399.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">INA126 amp + self-calibrating ref</text><text x="155.0" y="416.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">Rcal 0.1% on spare switch, gain 10</text><rect x="310" y="234" width="110" height="128" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4"/><text x="365.0" y="260.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Excitation</text><text x="365.0" y="277.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">ESP32 DAC</text><text x="365.0" y="294.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">GPIO25, 5 kHz</text><text x="365.0" y="311.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">MCP6002 buffer</text><text x="365.0" y="328.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">current path</text><text x="365.0" y="345.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">(R5 220 ohm)</text><rect x="20" y="444" width="400" height="50" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4"/><text x="220.0" y="465.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">MAX30102 finger pulse and SpO2</text><text x="220.0" y="482.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">I2C on GPIO21, GPIO22</text><rect x="20" y="510" width="400" height="50" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4"/><text x="220.0" y="531.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">2 answer buttons + SOS + tablet drawer</text><text x="220.0" y="548.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">GPIO4, GPIO5, GPIO15; drawer switch GPIO36</text><rect x="20" y="576" width="400" height="62" rx="7" fill="#e3f1f1" stroke="#5b6a6f" stroke-width="1.4" stroke-dasharray="6 4"/><text x="220.0" y="594.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">AD8232 ECG (optional)</text><text x="220.0" y="611.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">only on amber days; off for pacemaker / ICD</text><text x="220.0" y="628.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">GPIO34, GPIO39 (LO- unused)</text><rect x="20" y="654" width="400" height="48" rx="7" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="6 4"/><text x="220.0" y="674.0" text-anchor="middle" font-size="12" font-weight="400" fill="#7a4a00">Bad contact or toe ring: 'no reading',</text><text x="220.0" y="691.0" text-anchor="middle" font-size="12" font-weight="400" fill="#7a4a00">the voice asks to place the feet again</text><rect x="20" y="714" width="400" height="48" rx="7" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="6 4"/><text x="220.0" y="734.0" text-anchor="middle" font-size="12" font-weight="400" fill="#7a4a00">Guest on the stool: readings are ignored</text><text x="220.0" y="751.0" text-anchor="middle" font-size="12" font-weight="400" fill="#7a4a00">(weight and impedance do not fit the patient)</text><polyline points="155,218 155,234" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="155,296 155,312" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="155,362 155,378" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="310,265 290,265" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="290,403 470,403" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><text x="335" y="397" font-size="12" fill="#33454a">ADC GPIO35</text><polyline points="470,330 420,330" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="420,124 470,124" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="420,469 470,469" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="420,535 470,535" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="420,607 470,607" fill="none" stroke="#33454a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="470" y="96" width="380" height="504" rx="10" fill="#f4f7fc" stroke="#3b5ea8" stroke-width="2"/><rect x="490" y="116" width="340" height="78" rx="7" fill="#e4ebf7" stroke="#5b6a6f" stroke-width="1.4"/><text x="660.0" y="134.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Signal processing</text><text x="660.0" y="151.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">Goertzel at 5 kHz (never peak-to-peak)</text><text x="660.0" y="168.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">quality checks: steady load, contact,</text><text x="660.0" y="185.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">pulse quality; 'no reading' if bad</text><rect x="490" y="208" width="340" height="78" rx="7" fill="#e4ebf7" stroke="#5b6a6f" stroke-width="1.4"/><text x="660.0" y="234.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Alert engine x 2 users (offline)</text><text x="660.0" y="251.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">green / amber / red + reason, doctor's plan,</text><text x="660.0" y="268.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">coaching tip, daily self-test</text><rect x="490" y="300" width="340" height="56" rx="7" fill="#e4ebf7" stroke="#5b6a6f" stroke-width="1.4"/><text x="660.0" y="324.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Voice prompts from flash</text><text x="660.0" y="341.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">8-bit clips played on DAC2 (GPIO26)</text><rect x="490" y="370" width="340" height="70" rx="7" fill="#e4ebf7" stroke="#5b6a6f" stroke-width="1.4"/><text x="660.0" y="392.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">SMS queue: alerts, 11:00 reminder,</text><text x="660.0" y="409.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">Sunday summary, service alerts;</text><text x="660.0" y="426.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">retried through power or network cuts</text><rect x="490" y="520" width="340" height="60" rx="7" fill="#e4ebf7" stroke="#5b6a6f" stroke-width="1.4"/><text x="660.0" y="546.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Amulet data in</text><text x="660.0" y="563.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">7 days of data, handed over when in range</text><rect x="900" y="100" width="400" height="70" rx="7" fill="#fbeedd" stroke="#5b6a6f" stroke-width="1.4"/><text x="1100.0" y="122.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Power</text><text x="1100.0" y="139.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">18650 (protected) + TP4056 charger + MT3608 boost</text><text x="1100.0" y="156.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">battery-only while measuring, charger unplugged</text><rect x="900" y="178" width="400" height="36" rx="7" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1100.0" y="200.5" text-anchor="middle" font-size="12" font-weight="400" fill="#7a4a00">Power cut: runs on the battery, messages queue</text><rect x="900" y="222" width="400" height="50" rx="7" fill="#e6f3e6" stroke="#5b6a6f" stroke-width="1.4"/><text x="1100.0" y="243.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">3 LEDs + seat vibration</text><text x="1100.0" y="260.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">GPIO13, 23, 2; motor GPIO19</text><rect x="900" y="297" width="400" height="62" rx="7" fill="#e6f3e6" stroke="#5b6a6f" stroke-width="1.4"/><text x="1100.0" y="324.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Voice out</text><text x="1100.0" y="341.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">DAC2 &gt; PAM8403 amp &gt; 4 ohm 3 W speaker</text><rect x="900" y="372" width="400" height="66" rx="7" fill="#e6f3e6" stroke="#5b6a6f" stroke-width="1.4"/><text x="1100.0" y="401.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">SIM800L, 2G SMS (Airtel, Vi, BSNL; not Jio)</text><text x="1100.0" y="418.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">UART2: GPIO17, GPIO16</text><rect x="900" y="448" width="330" height="36" rx="7" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1065.0" y="470.5" text-anchor="middle" font-size="12" font-weight="400" fill="#7a4a00">No network: SIM800L retries every 10 min</text><polyline points="900,135 850,135" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="850,247 900,247" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="850,328 900,328" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><polyline points="850,405 900,405" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><rect x="470" y="640" width="380" height="128" rx="7" fill="#efe6f6" stroke="#5b6a6f" stroke-width="1.4"/><text x="660.0" y="674.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Kavach amulet (worn day and night)</text><text x="660.0" y="691.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">ESP32-C3 + motion sensor (demo: S3 Sense + MPU6050)</text><text x="660.0" y="708.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">night breathing, sit-ups, steps, falls, SOS button</text><text x="660.0" y="725.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">stores 7 days; charges in the stool's side dock</text><text x="660.0" y="742.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">Bluetooth Low Energy to the stool (built into both ESP32s)</text><polyline points="660,640 660,580" fill="none" stroke="#33454a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="672" y="616" font-size="12" font-weight="400" fill="#33454a" >BLE sync when in range; 7-day buffer if out of range</text><polyline points="1270,438 1270,798 140,798 140,828" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><text x="150" y="792" font-size="12" font-weight="400" fill="#33454a" >SMS alert from the SIM800L</text><text x="170" y="818" font-size="14" font-weight="700" fill="#0d6b6e" letter-spacing="1">CARE LOOP (SMS over 2G)</text><rect x="20" y="828" width="270" height="56" rx="7" fill="#fbe6e6" stroke="#5b6a6f" stroke-width="1.4"/><text x="155.0" y="852.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Family member 1</text><text x="155.0" y="869.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">SMS at once</text><rect x="350" y="828" width="270" height="56" rx="7" fill="#fbe6e6" stroke="#5b6a6f" stroke-width="1.4"/><text x="485.0" y="852.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">Family member 2</text><text x="485.0" y="869.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">no reply after 30 min</text><polyline points="290,856 350,856" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><rect x="680" y="828" width="270" height="56" rx="7" fill="#fbe6e6" stroke="#5b6a6f" stroke-width="1.4"/><text x="815.0" y="852.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">ASHA worker</text><text x="815.0" y="869.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">after 2 h, unless family replies 3 (fine)</text><polyline points="620,856 680,856" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><rect x="1010" y="828" width="270" height="56" rx="7" fill="#fbe6e6" stroke="#5b6a6f" stroke-width="1.4"/><text x="1145.0" y="852.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2427">PHC doctor</text><text x="1145.0" y="869.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2427">after 6 h if nobody has examined the patient</text><polyline points="950,856 1010,856" fill="none" stroke="#33454a" stroke-width="1.6" marker-end="url(#a)"/><text x="20" y="912" font-size="12.5" font-weight="400" fill="#1b2427" >Replies to the stool: 1 = I am checking, 2 = need help (goes straight to the ASHA), 3 = patient is fine; a missed call counts as 1. Timers as simulated in sim/careloop (92% reviewed before the hospital visit).</text><text x="20" y="972" font-size="15" font-weight="700" fill="#1b2427" >Monitoring, not diagnosis.</text></svg>